<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拼圖工具</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px sans-serif;padding:12px;background:#1a1a1a;color:#eee}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
label{display:flex;gap:6px;align-items:center;white-space:nowrap}
input[type=number]{width:70px;padding:6px 4px;background:#333;color:#eee;border:1px solid #555;border-radius:4px;font-size:16px}
button{padding:8px 14px;cursor:pointer;background:#4a9eff;color:#fff;border:none;border-radius:4px;font-size:14px;-webkit-tap-highlight-color:transparent}
button:active{background:#2a7edf}
#drop{border:2px dashed #555;border-radius:8px;padding:28px 16px;text-align:center;margin-bottom:12px;cursor:pointer;transition:.2s;font-size:15px}
#drop.over{border-color:#4a9eff;background:#1e2a3a}
#wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
#preview{display:grid;gap:0;width:fit-content;background:#000}
#preview img{display:block;width:100%;height:100%;object-fit:cover}
@media(max-width:480px){
  .ctrl{gap:8px}
  input[type=number]{width:60px}
  button{padding:8px 10px;font-size:13px}
}
</style></head><body>
<div class="ctrl">
  <label>輸出寬度(px)<input id="w" type="number" value="1200" min="100"></label>
  <label>每列幾張<input id="cols" type="number" value="3" min="1"></label>
  <label>間距(px)<input id="gap" type="number" value="0" min="0"></label>
  <button onclick="render()">🔄 重新排列</button>
  <button onclick="dl()">⬇ 下載圖片</button>
  <button onclick="imgs=[];document.getElementById('preview').innerHTML='';updateInfo()">🗑 清除</button>
  <span id="info" style="color:#888"></span>
</div>
<div id="drop">拖曳圖片到這裡，或點擊選取</div>
<div id="wrap"><div id="preview"></div></div>

<input id="fi" type="file" accept="image/*" multiple style="display:none">
<canvas id="c" style="display:none"></canvas>

<script>
let imgs=[];
const drop=document.getElementById('drop'),fi=document.getElementById('fi');

drop.onclick=()=>fi.click();
fi.onchange=e=>load([...e.target.files]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');load([...e.dataTransfer.files])};

function load(files){
  files.filter(f=>f.type.startsWith('image/')).forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{imgs.push(img);updateInfo();render()};
      img.src=e.target.result;
    };
    r.readAsDataURL(f);
  });
}

function updateInfo(){document.getElementById('info').textContent=`共 ${imgs.length} 張`}

function render(){
  if(!imgs.length)return;
  const cols=+document.getElementById('cols').value||1;
  const W=+document.getElementById('w').value||1200;
  const gap=+document.getElementById('gap').value||0;
  const cellW=Math.floor((W-gap*(cols-1))/cols);
  const p=document.getElementById('preview');
  p.style.gridTemplateColumns=`repeat(${cols},${cellW}px)`;
  p.style.gap=gap+'px';
  p.style.width=W+'px';
  p.innerHTML='';
  imgs.forEach(img=>{
    const h=Math.round(img.naturalHeight*cellW/img.naturalWidth);
    const el=document.createElement('img');
    el.src=img.src;
    el.style.height=h+'px';
    p.appendChild(el);
  });
}

function dl(){
  if(!imgs.length)return;
  const cols=+document.getElementById('cols').value||1;
  const W=+document.getElementById('w').value||1200;
  const gap=+document.getElementById('gap').value||0;
  const cellW=Math.floor((W-gap*(cols-1))/cols);
  const rows=Math.ceil(imgs.length/cols);
  const heights=[];
  for(let r=0;r<rows;r++){
    let maxH=0;
    for(let c=0;c<cols;c++){
      const i=r*cols+c;
      if(i<imgs.length){
        const h=Math.round(imgs[i].naturalHeight*cellW/imgs[i].naturalWidth);
        maxH=Math.max(maxH,h);
      }
    }
    heights.push(maxH);
  }
  const totalH=heights.reduce((a,b)=>a+b,0)+gap*Math.max(rows-1,0);
  const canvas=document.getElementById('c');
  canvas.width=W;canvas.height=totalH;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,totalH);
  let y=0;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const i=r*cols+c;
      if(i<imgs.length){
        const h=Math.round(imgs[i].naturalHeight*cellW/imgs[i].naturalWidth);
        const x=c*(cellW+gap);
        ctx.drawImage(imgs[i],x,y,cellW,h);
      }
    }
    y+=heights[r]+gap;
  }
  const a=document.createElement('a');
  a.download='collage.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
}
</script>
</body></html>
